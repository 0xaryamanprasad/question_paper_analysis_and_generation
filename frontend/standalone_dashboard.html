      border-color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.35);

    .em-btn-white {
      position: relative;

      display: inline-flex;
      align-items: center;

      padding: 14px 28px;

      color: #000000;

    }
    .em-btn-white:hover {
      background: #e4e4e7;
      border-color: #ffffff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }
    .em-btn-white:active {
      transform: scale(0.98);
    }

    /* Secondary dark button with white hover */
    .em-btn-dark {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid #27272a;
      background: #101014;
      color: #e4e4e7;
      cursor: pointer;
      transition: all 0.2s ease;

      background: #18181c;
      border-color: #ffffff;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.16);

      background-color: #0c0c0e;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px 18px;

    @keyframes tabFadeSlide {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

      animation: tabFadeSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

      0% {
        width: 0px;
        height: 0px;
        opacity: 0.75;
        transform: translate(-50%, -50%) scale(0);

      100% {
        width: 700px;
        height: 700px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }

          ripple.style.top = `${e.clientY - rect.top}px`;

            target.style.position = 'relative';
          }
          target.style.overflow = 'hidden';

          target.appendChild(ripple);
          setTimeout(() => {
            ripple.remove();
          }, 600);
        };

              has_internal_choice: true,
              unit_coverage: [],
            },
          ],
        },
        choice: {
          name: 'Choice Pattern: Answer 5 of 8 (50M)',
          duration: 2.0,
          sections: [
            {
              id: 1,
              section_name: 'Part A',
              description: '',
              question_count: 5,
              questions_to_attempt: 5,
              marks_per_question: 2.0,
              allowed_question_types: ['short'],
              has_internal_choice: false,
              unit_coverage: [],
            },
            {
              id: 2,
              section_name: 'Part B',
              description: '',
              question_count: 8,
              questions_to_attempt: 5,
              marks_per_question: 8.0,
              allowed_question_types: ['long'],
              has_internal_choice: false,
              unit_coverage: [],
            },
          ],
        },
        quiz: {
          name: 'Unit Quiz / Test (25M, 1h)',
          duration: 1.0,
          sections: [
            {
              id: 1,
              section_name: 'Part A (Quick Recall)',
              description: '',
              question_count: 5,
              questions_to_attempt: 5,
              marks_per_question: 1.0,
              allowed_question_types: ['mcq', 'short'],
              has_internal_choice: false,
              unit_coverage: [],
            },
            {
              id: 2,
              section_name: 'Part B (Descriptive)',
              description: '',
              question_count: 4,
              questions_to_attempt: 4,
              marks_per_question: 5.0,
              allowed_question_types: ['medium'],
              has_internal_choice: false,
              unit_coverage: [],
            },
          ],
        },
      };

      const applyPreset = (key) => {
        setSelectedPreset(key);
        if (PRESETS[key]) {
          setDurationHours(PRESETS[key].duration);
          setSections(PRESETS[key].sections.map(s => ({ ...s, id: Math.random() })));
        }
      };

      const addSection = () => {
        setSelectedPreset('custom');
        const nextChar = String.fromCharCode(65 + sections.length);
        const newSec = {
          id: Date.now(),
          section_name: `Part ${nextChar}`,
          description: '',
          question_count: 4,
          questions_to_attempt: 4,
          marks_per_question: 5.0,
          allowed_question_types: ['medium'],
          has_internal_choice: false,
          unit_coverage: [],
        };
        setSections([...sections, newSec]);
      };

      const removeSection = (id) => {
        if (sections.length <= 1) {
          alert('A question paper must have at least one section.');
          return;
        }
        setSelectedPreset('custom');
        setSections(sections.filter(s => s.id !== id));
      };

      const updateSection = (id, field, value) => {
        setSelectedPreset('custom');
        setSections(sections.map(s => s.id === id ? { ...s, [field]: value } : s));
      };

      const moveSection = (index, direction) => {
        setSelectedPreset('custom');
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= sections.length) return;
        const newSecs = [...sections];
        const temp = newSecs[index];
        newSecs[index] = newSecs[targetIndex];
        newSecs[targetIndex] = temp;
        setSections(newSecs);
      };

      const toggleQuestionType = (secId, type) => {
        setSelectedPreset('custom');
        setSections(sections.map(s => {
          if (s.id !== secId) return s;
          const current = s.allowed_question_types || [];
          if (current.includes(type)) {
            if (current.length === 1) return s; // Keep at least one type
            return { ...s, allowed_question_types: current.filter(t => t !== type) };
          } else {
            return { ...s, allowed_question_types: [...current, type] };
          }
        }));
      };

      const toggleUnitCoverage = (secId, unitNumber) => {
        setSelectedPreset('custom');
        setSections(sections.map(s => {
          if (s.id !== secId) return s;
          const current = s.unit_coverage || [];
          if (current.includes(unitNumber)) {
            return { ...s, unit_coverage: current.filter(u => u !== unitNumber) };
          } else {
            return { ...s, unit_coverage: [...current, unitNumber].sort((a, b) => a - b) };
          }
        }));
      };

      const calculatedTotalMarks = sections.reduce((sum, s) => {
        const attempt = s.questions_to_attempt ? parseInt(s.questions_to_attempt, 10) : parseInt(s.question_count, 10);
        return sum + (attempt * parseFloat(s.marks_per_question || 0));
      }, 0);

      const calculatedTotalQuestions = sections.reduce((sum, s) => {
        return sum + parseInt(s.question_count || 0, 10);
      }, 0);

      const addCustomUnit = () => {
        const nextNum = customUnits.length + 1;
        setCustomUnits([
          ...customUnits,
          {
            id: Date.now(),
            unit_name: `Unit ${nextNum}: New Unit Title`,
            topics: '',
            keywords: '',
          },
        ]);
      };

      const removeCustomUnit = (id) => {
        if (customUnits.length <= 1) {
          alert('You must have at least one unit in the syllabus.');
          return;
        }
        setCustomUnits(customUnits.filter(u => u.id !== id));
      };

      const updateCustomUnit = (id, field, value) => {
        setCustomUnits(customUnits.map(u => u.id === id ? { ...u, [field]: value } : u));
      };

      const applySyllabusPreset = (presetKey) => {
        const p = SYLLABUS_PRESETS[presetKey];
        if (!p) return;
        setSubject(p.subject);
        setCourseCode(p.course_code);
        setCustomUnits(p.units.map(u => ({ ...u, id: Math.random() })));
        setUseCustomSyllabus(true);
      };

      const parseSyllabusFromText = () => {
        if (!rawSyllabusText.trim()) {
          alert('Please enter or paste your syllabus text first.');
          return;
        }

        const lines = rawSyllabusText.split('\n');
        const parsedUnits = [];
        let currentUnit = null;

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;

          const unitMatch = trimmed.match(/^(?:###\s*)?(?:unit|module|chapter|part)\s*(\d+)[\s*:\-–—]+(.*)$/i) ||
                            trimmed.match(/^(\d+)[\.\)]\s+(.*)$/);

          if (unitMatch) {
            if (currentUnit) parsedUnits.push(currentUnit);
            currentUnit = {
              id: Date.now() + Math.random(),
              unit_name: unitMatch[2] ? unitMatch[2].trim() : `Unit ${unitMatch[1]}`,
              topics: '',
              keywords: '',
            };
          } else if (currentUnit) {
            if (!currentUnit.topics) {
              currentUnit.topics = trimmed;
            } else {
              currentUnit.topics += ', ' + trimmed;
            }
          } else {
            currentUnit = {
              id: Date.now() + Math.random(),
              unit_name: 'Unit 1: ' + trimmed,
              topics: '',
              keywords: '',
            };
          }
        }

        if (currentUnit) parsedUnits.push(currentUnit);

        if (parsedUnits.length === 0) {
          alert('Could not detect units. Try formatting with "Unit 1: Name" or "1. Name".');
          return;
        }

        parsedUnits.forEach(u => {
          if (u.topics) {
            const words = u.topics
              .split(/[,;\n]+/)
              .map(w => w.trim())
              .filter(w => w.length > 3);
            u.keywords = Array.from(new Set(words)).slice(0, 8).join(', ');
          }
        });

        setCustomUnits(parsedUnits);
        setSyllabusMode('structured');
        setUseCustomSyllabus(true);
      };

      // Playground State
      const [playPrompt, setPlayPrompt] = useState('Explain deadlock prevention and avoidance using Banker\'s algorithm and resource allocation graphs.');
      const [clfResult, setClfResult] = useState(null);
      const [clfLoading, setClfLoading] = useState(false);
      const [playSubject, setPlaySubject] = useState('auto');

      useEffect(() => {
        // Auto-detect existing uploaded paper subject on mount
        fetch(`${API_BASE}/api/v1/papers`)
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && data.papers && data.papers.length > 0) {
              const latest = data.papers[0];
              if (latest.subject) {
                setSubject(latest.subject);
                if (latest.subject.toLowerCase().includes('math')) {
                  setCourseCode('BS102');
                  setCustomUnits(SYLLABUS_PRESETS.math.units);
                }
              }
            }
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        loadAnalytics(false);
      }, [subject]);

      const loadAnalytics = async (isManual = false) => {
        setAnalyticsLoading(true);
        if (isManual) setAnalyticsToast('Refreshing analytics from server...');
        try {
          const [hRes, wRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/analysis/historical?subject=${encodeURIComponent(subject)}`).then(async r => {
              if (!r.ok) {
                const text = await r.text();
                throw new Error(`Historical API error (HTTP ${r.status}): ${text}`);
              }
              return r.json();
            }),
            fetch(`${API_BASE}/api/v1/analysis/weightage?subject=${encodeURIComponent(subject)}`).then(async r => {
              if (!r.ok) {
                const text = await r.text();
                throw new Error(`Weightage API error (HTTP ${r.status}): ${text}`);
              }
              return r.json();
            }),
          ]);
          setHistData(hRes);
          setWeightData(wRes);
          const count = hRes?.total_papers_analyzed || 0;
          const qCount = hRes?.total_questions_analyzed || hRes?.total_questions || 0;
          if (count > 0) {
            setAnalyticsToast(`✓ Ingested Intelligence: ${count} paper(s) and ${qCount} question(s) indexed for "${subject}"`);
          } else {
            setAnalyticsToast(`ℹ Context is clean (0 papers indexed for "${subject}"). Ready to upload new papers.`);
          }
        } catch (e) {
          console.error('Analytics load error:', e);
          setAnalyticsToast(`⚠️ Server offline or connection error: ${e.message}`);
          if (isManual) {
            alert(`Failed to sync intelligence from backend:\n${e.message}\n\nPlease verify that the backend server is running on port 8000.`);
          }
        } finally {
          setAnalyticsLoading(false);
        }
      };

      const handleResetCorpus = async (clearAll = false) => {
        const targetSubject = clearAll ? 'ALL subjects across the entire platform' : `"${subject}"`;
        const confirmed = window.confirm(
          `RESET INTELLIGENCE CONTEXT?\n\n` +
          `This will completely wipe previously uploaded PDF papers, extracted OCR text, and questions for ${targetSubject}.\n\n` +
          `• Total papers analyzed will reset to 0.\n` +
          `• The app's memory will be wiped clean so it can learn fresh for another subject.\n\n` +
          `Do you want to proceed?`
        );
        if (!confirmed) return;

        setResettingCorpus(true);
        setAnalyticsToast('Wiping context and removing uploaded papers...');
        try {
          const url = clearAll
            ? `${API_BASE}/api/v1/papers/reset?all_data=true`
            : `${API_BASE}/api/v1/papers/reset?subject=${encodeURIComponent(subject)}`;

          const res = await fetch(url, { method: 'DELETE' }).then(async r => {
            if (!r.ok) {
              const text = await r.text();
              throw new Error(`Reset failed (HTTP ${r.status}): ${text}`);
            }
            return r.json();
          });

          // Reset all local UI states to 0
          setHistData(null);
          setWeightData(null);
          setQuestionsList([]);
          setUploadRes(null);
          setUploadFile(null);
          setAnalyticsToast(`✓ Intelligence context reset: ${res.deleted_count || 0} paper(s) removed. Ready for new subject.`);
          await loadAnalytics(false);
        } catch (err) {
          console.error('Reset error:', err);
          alert('Failed to reset corpus: ' + err.message);
          setAnalyticsToast(`⚠️ Reset failed: ${err.message}`);
        } finally {
          setResettingCorpus(false);
        }
      };

      const handleUpload = async (e) => {
        e.preventDefault();
        if (!uploadFile) return;
        setUploading(true);
        try {
          const fd = new FormData();
          fd.append('file', uploadFile);
          fd.append('subject', subject);
          fd.append('year', uploadYear || '2023');
          fd.append('semester', uploadSemester || 'Fall');

          const res = await fetch(`${API_BASE}/api/v1/papers/upload`, { method: 'POST', body: fd }).then(async r => {
            const text = await r.text();
            if (!r.ok) {
              try {
                const errJson = JSON.parse(text);
                throw new Error(errJson.detail || text);
              } catch (e) {
                throw new Error(text || `Server error (HTTP ${r.status})`);
              }
            }
            return JSON.parse(text);
          });
          setUploadRes(res);
          const qData = await fetch(`${API_BASE}/api/v1/papers/${res.id}/questions`).then(r => r.ok ? r.json() : []);
          setQuestionsList(qData);
          try {
            const txtRes = await fetch(`${API_BASE}/api/v1/papers/${res.id}/text`).then(r => r.ok ? r.json() : null);
            if (txtRes && txtRes.full_structured_text) {
              setFullPageText(txtRes.full_structured_text);
            }
          } catch (_) {}
          if (res.subject) {
            setSubject(res.subject);
            if (res.subject.toLowerCase().includes('math')) {
              setCourseCode('BS102');
              setCustomUnits(SYLLABUS_PRESETS.math.units);
            }
          }
          loadAnalytics(false);
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          setUploading(false);
        }
      };

      const handleGenerate = async () => {
        setGenLoading(true);
        setGeneratedPaper(null);
        setValReport(null);
        try {
          const bp = {
            subject,
            course_code: courseCode,
            total_marks: calculatedTotalMarks,
            duration_hours: parseFloat(durationHours),
            institution_name: institution,
            examination_name: examName,
            sections: sections.map(s => {
              const qCount = parseInt(s.question_count, 10) || 1;
              const qAttempt = s.questions_to_attempt ? parseInt(s.questions_to_attempt, 10) : qCount;
              const marksPerQ = parseFloat(s.marks_per_question) || 1.0;
              let desc = s.description;
              if (!desc || !desc.trim()) {
                if (qAttempt < qCount) {
                  desc = `Answer any ${qAttempt} questions out of ${qCount}. (${qAttempt} x ${marksPerQ} = ${qAttempt * marksPerQ} Marks)`;
                } else if (s.has_internal_choice) {
                  desc = `Answer ALL questions. Each question has an internal choice. (${qCount} x ${marksPerQ} = ${qCount * marksPerQ} Marks)`;
                } else {
                  desc = `Answer ALL questions. (${qCount} x ${marksPerQ} = ${qCount * marksPerQ} Marks)`;
                }
              }
              return {
                section_name: s.section_name || 'Section',
                description: desc,
                question_count: qCount,
                questions_to_attempt: qAttempt,
                marks_per_question: marksPerQ,
                allowed_question_types: s.allowed_question_types && s.allowed_question_types.length > 0 ? s.allowed_question_types : ['medium'],
                has_internal_choice: !!s.has_internal_choice,
                unit_coverage: s.unit_coverage && s.unit_coverage.length > 0 ? s.unit_coverage : null,
              };
            }),
            incorporate_historical_trends: incorporateTrends,
            avoid_recent_duplicates: avoidDuplicates,
          };

          let syllabusPayload = null;
          if (useCustomSyllabus && customUnits.length > 0) {
            syllabusPayload = {
              subject: subject || 'Custom Course',
              course_code: courseCode || null,
              units: customUnits.map((u, idx) => ({
                unit_number: idx + 1,
                unit_name: u.unit_name || `Unit ${idx + 1}`,
                topics: (Array.isArray(u.topics) ? u.topics : (u.topics || '').split(','))
                  .map(t => t.trim())
                  .filter(Boolean),
                keywords: (Array.isArray(u.keywords) ? u.keywords : (u.keywords || '').split(','))
                  .map(k => k.trim())
                  .filter(Boolean),
              })),
            };
          }

          const pRes = await fetch(`${API_BASE}/api/v1/generation/generate-paper`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ blueprint: bp, syllabus: syllabusPayload }),
          }).then(async r => {
            if (!r.ok) {
              const err = await r.json();
              throw new Error(err.detail || 'Paper generation failed');
            }
            return r.json();
          });

          setGeneratedPaper(pRes);

          const vRes = await fetch(`${API_BASE}/api/v1/generation/validate-paper`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paper: pRes, blueprint: bp, syllabus: syllabusPayload }),
          }).then(r => r.json());

          setValReport(vRes);
        } catch (e) {
          alert('Generation error: ' + (e.message || e));
        } finally {
          setGenLoading(false);
        }
      };

      const handleDownloadPDF = async () => {
        if (!generatedPaper) return;
        const res = await fetch(`${API_BASE}/api/v1/generation/render-pdf`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(generatedPaper),
        });
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${subject.replace(/\s+/g, '_').toLowerCase()}_exam_paper.pdf`;
        a.click();
      };

      const handleClassify = async () => {
        setClfLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/v1/analysis/classify-question`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question_text: playPrompt, subject: playSubject || 'auto' }),
          }).then(r => r.json());
          setClfResult(res);
        } catch (e) {
          alert('Classification failed: ' + e);
        } finally {
          setClfLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-black text-white relative overflow-x-hidden selection:bg-white selection:text-black font-sans">

          <div className="fixed inset-0 pointer-events-none oled-grid z-0 opacity-60"></div>

          {/* Top Navigation Bar: Scaled Larger, Pure Black with White Elements */}
          <header className="sticky top-0 z-40 backdrop-blur-2xl bg-black/85 border-b border-zinc-800/80">
            <div className="max-w-[1400px] mx-auto px-6 h-20 flex items-center justify-between gap-6">
              {/* Left Brand: Emblem + Title + Version Tag */}
              <div
                className="flex items-center gap-3.5 cursor-pointer group shrink-0"
                onClick={() => setActiveTab('dashboard')}
              >
                <div className="w-12 h-12 rounded-2xl bg-white/10 border border-white/20 backdrop-blur-md flex items-center justify-center shadow-lg shadow-blue-500/10 transition-transform group-hover:scale-105 overflow-hidden p-1 shrink-0">
                  <img
                    src="/icon.png"
                    alt="PaperMind"
                    className="w-full h-full object-contain filter drop-shadow"
                    onError={(e) => { e.target.src = 'assets/papermind_icon.png'; }}
                  />
                </div>
                <div>
                  <div className="flex items-center gap-2.5">
                    <span className="font-extrabold text-white text-xl sm:text-2xl tracking-tight font-sans">PaperMind</span>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold text-black bg-white border border-white">
                      Studio v2.4
                    </span>
                  </div>
                  <div className="text-xs text-zinc-400 font-medium hidden sm:block">
                    Understand Papers. Predict Patterns. Create Exams.
                  </div>
                </div>
              </div>

              {/* Center Navigation Tabs: White Highlight on Hover & Solid White when Active */}
              <nav className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setActiveTab('dashboard')}
                  className={`em-tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                  </svg>
                  <span>Intelligence</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('upload')}
                  className={`em-tab-btn ${activeTab === 'upload' ? 'active' : ''}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                  </svg>
                  <span>Ingestion</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('generate')}

                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                  </svg>
                  <span>Paper Studio</span>
                  <span className={`hidden md:inline-block px-2 py-0.5 rounded text-[11px] font-mono font-bold ${activeTab === 'generate' ? 'bg-black text-white' : 'bg-zinc-800 text-zinc-300'}`}>
                    Syllabus
                  </span>
                </button>

                <button
                  type="button"

                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                  </svg>
                  <span>NLP Lab</span>
                </button>
              </nav>

              {/* Right Active Subject Badge */}
              <div className="hidden lg:flex items-center gap-2 px-4 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-300 font-mono text-sm hover:border-white transition-all cursor-default">
                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span className="font-bold text-white">{courseCode}</span>
                <span className="text-zinc-600">·</span>
                <span className="truncate max-w-[150px] text-zinc-300">{subject}</span>
              </div>
            </div>
          </header>

          {/* Main Content Area: Scaled Up, Pure Black with White Hover Highlight on Tiles */}
          <main className="grow max-w-[1400px] w-full mx-auto px-6 py-10 z-10">
            {/* TAB 1: ANALYTICS & INTELLIGENCE */}
            {activeTab === 'dashboard' && (
              <div key="tab-dashboard" className="tab-animate space-y-8">
                {/* Hero Section */}
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-6 border-b border-zinc-800">
                  <div className="space-y-2">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 text-white text-xs font-mono font-bold border border-white/20">
                      <span>⚡</span>
                      <span>ANALYTICS ENGINE</span>
                    </div>
                    <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
                      Examination Historical Intelligence
                    </h1>
                    <p className="text-base text-zinc-400 max-w-3xl">
                      Longitudinal syllabus topic recurrence, Bloom's cognitive taxonomy distribution, and unit weightage analytics calculated using dense lexical and semantic vectors.
                    </p>
                    <div className="flex items-center gap-2 pt-1">
                      <span className="text-xs font-mono text-zinc-500">Active Subject:</span>

                {/* Generated Paper Preview & Independent Validation */}
                {generatedPaper && (
                  <div className="space-y-6">
                    {/* Validation Card */}
                    {valReport && (
                      <div className="em-tile p-6 sm:p-7 space-y-4">
                        <div className="flex justify-between items-center pb-4 border-b border-zinc-800">
                          <div className="flex items-center gap-3">
                            <span className={`w-3 h-3 rounded-full ${valReport.is_valid ? 'bg-white shadow-[0_0_10px_#ffffff]' : 'bg-rose-500'}`}></span>
                            <span className="font-bold text-white text-base">
                              {valReport.is_valid ? 'All Academic Blueprint Constraints Satisfied' : 'Validation Constraints Flagged'}
                            </span>
                          </div>
                          <span className="px-3 py-1 rounded-full bg-white text-black font-mono font-extrabold text-sm shadow-md">
                            Score: {valReport.overall_quality_score}/100
                          </span>
                        </div>

                        <div className="space-y-2 font-mono text-xs">
                          {valReport.passed_checks.map((c, i) => (
                            <div key={i} className="text-zinc-300 flex items-center gap-2">
                              <span className="font-bold text-white">✓</span>
                              <span>{c}</span>
                            </div>
                          ))}
                          {valReport.warnings && valReport.warnings.map((w, i) => (
                            <div key={i} className="text-zinc-400 flex items-center gap-2">
                              <span className="font-bold text-white">⚠</span>
                              <span>{w}</span>
                            </div>
                          ))}
                          {valReport.failed_checks && valReport.failed_checks.map((f, i) => (
                            <div key={i} className="text-rose-400 font-semibold flex items-center gap-2">
                              <span className="font-bold">✗</span>
                              <span>{f}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Toolbar */}
                    <div className="flex justify-between items-center p-5 rounded-2xl bg-zinc-950 border border-zinc-800">
                      <button
                        onClick={() => setShowRubrics(!showRubrics)}
                        className="em-btn-dark !py-2.5 !px-5 !text-xs"
                      >
                        {showRubrics ? 'Hide Marking Schemes' : 'Show Marking Schemes & Rubrics'}
                      </button>
                      <button
                        onClick={handleDownloadPDF}
                        className="em-btn-white !py-2.5 !px-6 !text-xs"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <span>Download Camera-Ready PDF</span>
                      </button>
                    </div>

                    {/* Academic Question Paper Preview Sheet */}
                    <div className="bg-zinc-950 p-8 sm:p-14 rounded-3xl border-2 border-zinc-800 shadow-2xl font-serif text-white text-sm space-y-6">
                      {/* Top Registration & QP Code Bar */}
                      <div className="flex justify-between items-center text-xs font-mono border-b border-zinc-800 pb-3 text-zinc-400">
                        <span><b>Reg. No.:</b> [&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]</span>
                        <span><b>Q.P. Code:</b> S{Math.abs((generatedPaper.id || 'paper').split('').reduce((acc, c) => (acc * 31 + c.charCodeAt(0)) | 0, 0)) % 899 + 101}</span>
                      </div>

                      <div className="text-center space-y-1.5 pt-1">
                        <h3 className="font-bold text-xl sm:text-2xl uppercase tracking-wider text-white">
                          {generatedPaper.institution_name?.toLowerCase().includes('antigravity') ? 'NATIONAL INSTITUTE OF TECHNOLOGY' : generatedPaper.institution_name}
                        </h3>
                        <p className="text-xs uppercase tracking-widest text-zinc-400 font-sans">
                          Autonomous Institution &middot; Affiliated to State Technological University
                        </p>
                        <h4 className="font-semibold text-sm sm:text-base uppercase tracking-wide text-zinc-200 pt-1">
                          {generatedPaper.examination_name || 'B.Tech Degree End Semester Examinations'}
                        </h4>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 font-sans text-xs text-zinc-300 pt-3 border-t border-b border-zinc-800 my-3 py-2 text-left">
                          <div><span className="text-zinc-500 block text-[10px] uppercase font-bold tracking-wider">Course / Subject</span> <b>{generatedPaper.course_code ? `${generatedPaper.course_code} - ` : ''}{generatedPaper.subject}</b></div>
                          <div><span className="text-zinc-500 block text-[10px] uppercase font-bold tracking-wider">Max Marks</span> <b>{generatedPaper.total_marks} Marks</b></div>
                          <div><span className="text-zinc-500 block text-[10px] uppercase font-bold tracking-wider">Duration</span> <b>{generatedPaper.duration_hours} Hours</b></div>
                          <div><span className="text-zinc-500 block text-[10px] uppercase font-bold tracking-wider">Semester / Exam</span> <b>Regular / End-Term</b></div>
                        </div>

                        <div className="text-left font-sans text-[11px] text-zinc-400 bg-zinc-900/60 p-3 rounded-xl border border-zinc-800/80 space-y-0.5">
                          <b>General Instructions:</b>
                          <div>1. Answer ALL questions from Part A (Compulsory).</div>
                          <div>2. Answer questions from subsequent sections according to choice constraints.</div>
                          <div>3. The figures in the right-hand margin indicate full marks for the respective questions.</div>
                          <div>4. Mathematical tables and non-programmable scientific calculators are permitted. State all assumptions clearly.</div>
                        </div>
                      </div>

                      {generatedPaper.sections.map((sec, sIdx) => (
                        <div key={sIdx} className="space-y-4 pt-2">
                          <div className="text-center font-sans font-bold text-sm uppercase tracking-wide text-white border-b border-dashed border-zinc-800 pb-2">
                            {sec.section_name} - <span className="font-normal italic normal-case text-zinc-400">{sec.description}</span>
                          </div>
                          <div className="space-y-5">
                            {sec.questions.map((q, qIdx) => {
                              const isOr = q.question_number?.includes('(OR)');
                              const rawStem = (q.question_text || '').trim();
                              const hasSubParts = q.sub_parts && q.sub_parts.length > 0;
                              const hasDistinctStem = (
                                hasSubParts &&
                                Boolean(rawStem) &&
                                !rawStem.toLowerCase().startsWith('(a)') &&
                                !rawStem.toLowerCase().startsWith('a)') &&
                                !q.sub_parts.some(sp => sp.text && rawStem.includes(sp.text.slice(0, 20)))
                              );

                              return (
                                <div key={q.id || qIdx} className="space-y-2">
                                  {isOr && (
                                    <div className="text-center font-bold text-zinc-500 font-sans my-3 tracking-widest text-xs">
                                      [ &mdash; OR &mdash; ]
                                    </div>
                                  )}
                                  <div className="flex justify-between items-start gap-4">
                                    <span className="font-bold font-sans font-mono w-14 shrink-0 text-white">
                                      {isOr ? '' : `${q.question_number}.`}
                                    </span>
                                    <div className="grow space-y-2">
                                      {(!hasSubParts || hasDistinctStem) && (
                                        <p className="leading-relaxed text-zinc-200 text-sm">
                                          {q.question_text}
                                        </p>
                                      )}
                                      {hasSubParts && (
                                        <div className="space-y-2 pt-1 font-sans text-xs">
                                          {q.sub_parts.map((sp, spIdx) => (
                                            <div key={spIdx} className="flex justify-between text-zinc-200 leading-relaxed gap-3">
                                              <span><b>({sp.label})</b> {sp.text}</span>
                                              <span className="font-mono font-semibold text-zinc-400 shrink-0">[{sp.marks}m]</span>
                                            </div>
                                          ))}
                                        </div>
                                      )}
                                      {showRubrics && q.marking_scheme?.length > 0 && (
                                        <div className="p-4 bg-zinc-950 rounded-xl font-sans text-xs text-zinc-300 border border-zinc-800 mt-2 space-y-1">
                                          <b className="block text-white font-mono">Step-by-Step Marking Rubric:</b>
                                          <ul className="list-disc pl-4 space-y-0.5">
                                            {q.marking_scheme.map((rubric, rIdx) => (
                                              <li key={rIdx}>{rubric}</li>
                                            ))}
                                          </ul>
                                        </div>
                                      )}
                                    </div>
                                    <span className="font-bold font-sans font-mono text-white shrink-0">
                                      [{q.marks}]
                                    </span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: LINGUISTIC NLP LAB */}
            {activeTab === 'playground' && (
              <div key="tab-playground" className="tab-animate max-w-4xl mx-auto space-y-8">
                {/* Hero Header */}
                <div className="text-center space-y-3 mb-6">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/10 border border-white/20 text-white text-xs font-mono font-bold">
                    <span className="w-2 h-2 rounded-full bg-white"></span>
                    <span>NLP Linguistic Playground</span>
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
                    Cognitive & Syllabus Taxonomy Analyzer
                  </h2>
                  <p className="text-base text-zinc-400 max-w-xl mx-auto">
                    Directly test the 3-tier hybrid syllabus topic classifier and the Revised Bloom's Taxonomy cognitive parser with real-time feedback.
                  </p>
                </div>

                {/* macOS Card */}
                <div className="em-tile">
                  <div className="bg-zinc-950 px-6 py-4 border-b border-zinc-800 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-full bg-zinc-700"></span>
                        <span className="w-3 h-3 rounded-full bg-zinc-700"></span>
                        <span className="w-3 h-3 rounded-full bg-zinc-700"></span>
                      </div>
                      <span className="text-xs font-mono font-bold text-zinc-300 ml-2">nlp_playground.py</span>
                    </div>
                    <span className="text-xs font-mono font-bold text-black bg-white px-3 py-1 rounded-full">
                      spaCy + Semantic Vectors
                    </span>
                  </div>

                  <div className="p-6 sm:p-8 space-y-6">
                    {/* Domain / Subject Selector */}
                    <div className="p-4 bg-zinc-900/80 rounded-2xl border border-zinc-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono font-bold uppercase tracking-wider text-zinc-400">Target Syllabus Domain:</span>
                        <span className="text-[11px] font-mono text-zinc-500">Gemini LLM & Multi-tier Vector Classifier</span>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {[
                          { id: 'auto', label: '⚡ Auto-Detect Domain' },
                          { id: 'Computer Organization and Architecture', label: '⚙️ Architecture (COA)' },
                          { id: 'Operating Systems', label: '💻 Operating Systems' },
                          { id: 'Mathematics - II', label: '📐 Mathematics-II' },
                          { id: 'Data Structures and Algorithms', label: '🌳 DSA' },
                          { id: 'Database Management Systems', label: '🗄️ DBMS' },
                        ].map(sub => (
                          <button
                            key={sub.id}
                            type="button"
                            onClick={() => setPlaySubject(sub.id)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-mono font-bold transition-all ${
                              playSubject === sub.id
                                ? 'bg-white text-black shadow'
                                : 'bg-black text-zinc-400 hover:text-white border border-zinc-800'
                            }`}
                          >
                            {sub.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-3">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-sm">
                        <label className="font-semibold text-zinc-200">Enter Exam Question Prompt</label>
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-xs text-zinc-500 font-mono">Try Samples:</span>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Computer Organization and Architecture');
                              setPlayPrompt("What is pipelining in computer architecture? Explain pipeline hazards.");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            COA (Pipelining)
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Computer Organization and Architecture');
                              setPlayPrompt("What is the meaning of a gigabyte in computer storage hierarchy?");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            COA (Gigabyte)
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Operating Systems');
                              setPlayPrompt("Explain deadlock prevention and avoidance using Banker's algorithm and resource allocation graphs.");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            OS (Deadlock)
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Mathematics - II');
                              setPlayPrompt("Find the particular integral of the differential equation y'' + y = cos x.");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            Math (ODE)
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Mathematics - II');
                              setPlayPrompt("State Cauchy-Riemann equations in polar form and test if f(z) = |z|^2 is analytic.");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            Math (Complex)
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Data Structures and Algorithms');
                              setPlayPrompt("Explain the working of AVL Tree rotations with an example of Left-Right (LR) imbalance.");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            DSA (Trees)
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setPlaySubject('Database Management Systems');
                              setPlayPrompt("Define BCNF (Boyce-Codd Normal Form) and explain lossless-join decomposition with functional dependencies.");
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white font-mono cursor-pointer"
                          >
                            DBMS (BCNF)
                          </button>
                        </div>
                      </div>
                      <textarea
                        rows={4}
                        value={playPrompt}
                        onChange={e => setPlayPrompt(e.target.value)}
                        placeholder="Paste any examination question prompt here (Operating Systems, Mathematics, DSA, DBMS)..."
                        className="em-input font-mono text-sm"
                      ></textarea>
                    </div>

                    <button
                      onClick={handleClassify}
                      disabled={clfLoading}
                      className="w-full em-btn-white !py-4 text-base"
                    >
                      {clfLoading && <span className="animate-spin text-base">↻</span>}
                      <span>{clfLoading ? 'Analyzing Question...' : 'Run Dual Topic & Bloom’s Taxonomy Classification'}</span>
                    </button>

                    {clfResult && (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                        {/* Topic Classification Result Card */}
                        <div className="rounded-2xl bg-zinc-950 border border-zinc-800 overflow-hidden shadow-sm hover:border-white transition-all">
                          <div className="px-5 py-3 bg-black border-b border-zinc-800 flex justify-between items-center">
                            <span className="font-mono text-xs text-white font-bold">topic_classifier.py</span>
                            <span className="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-white text-black">
                              {Math.round((clfResult.topic_classification?.confidence || 0) * 100)}% Confidence
                            </span>
                          </div>
                          <div className="p-5 text-sm space-y-2.5">
                            <div><span className="text-zinc-500">Domain / Subject:</span> <b className="text-white">{clfResult.topic_classification?.subject || 'Operating Systems'}</b> <span className="text-xs text-zinc-400 font-mono font-bold">({clfResult.topic_classification?.course_code || 'CS202'})</span></div>
                            <div><span className="text-zinc-500">Unit:</span> <b className="text-white">Unit {clfResult.topic_classification?.unit_number} ({clfResult.topic_classification?.unit_name})</b></div>
                            <div><span className="text-zinc-500">Topic:</span> <b className="text-white">{clfResult.topic_classification?.topic}</b></div>
                            <div><span className="text-zinc-500">Tier / Engine:</span> <span className="font-mono text-zinc-300">{clfResult.topic_classification?.classification_method || clfResult.topic_classification?.method}</span></div>
                            <div className="pt-2">
                              <span className="block text-zinc-500 mb-1.5 text-xs">Keywords Detected:</span>
                              <div className="flex flex-wrap gap-1.5">
                                {clfResult.topic_classification?.matched_keywords?.map((k, i) => (
                                  <span key={i} className="px-2.5 py-0.5 rounded bg-zinc-900 text-xs font-mono text-white border border-zinc-800">
                                    {k}
                                  </span>
                                ))}
                              </div>
                            </div>
                          </div>
                        </div>

                        {/* Bloom's Classification Result Card */}
                        <div className="rounded-2xl bg-zinc-950 border border-zinc-800 overflow-hidden shadow-sm hover:border-white transition-all">
                          <div className="px-5 py-3 bg-black border-b border-zinc-800 flex justify-between items-center">
                            <span className="font-mono text-xs text-white font-bold">blooms_engine.py</span>
                            <span className="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-white text-black">
                              {Math.round((clfResult.blooms_classification?.confidence || 0) * 100)}% Confidence
                            </span>
                          </div>
                          <div className="p-5 text-sm space-y-2.5">
                            <div><span className="text-zinc-500">Cognitive Level:</span> <span className="font-bold text-white">{clfResult.blooms_classification?.blooms_level}</span></div>
                            <div><span className="text-zinc-500">Directive Verb:</span> <span className="font-mono text-white font-bold">{clfResult.blooms_classification?.directive_verb || 'None'}</span></div>
                            <div><span className="text-zinc-500">Category:</span> <span className="text-white font-semibold">{clfResult.blooms_classification?.is_higher_order ? 'Higher-Order Thinking (HOT)' : 'Lower-Order Thinking (LOT)'}</span></div>
                            <p className="text-xs text-zinc-400 pt-2 border-t border-zinc-800">
                              {clfResult.blooms_classification?.rationale}
                            </p>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Platform Footer */}
          <footer className="mt-auto border-t border-zinc-800 bg-black py-8 text-center text-sm text-zinc-400">
            <div className="max-w-[1400px] mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2.5">
                <div className="w-7 h-7 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center overflow-hidden p-0.5">
                  <img
                    src="/icon.png"
                    alt="PaperMind"
                    className="w-full h-full object-contain"
                    onError={(e) => { e.target.src = 'assets/papermind_icon.png'; }}
                  />
                </div>
                <span className="font-bold text-white">PaperMind Studio</span>
                <span className="text-zinc-600">·</span>
                <span>Understand Papers. Predict Patterns. Create Exams.</span>
              </div>
              <div className="flex items-center gap-2.5 font-mono text-xs text-zinc-400">
                <span className="px-3 py-1 rounded-lg bg-zinc-950 border border-zinc-800">PaddleOCR PP-OCRv5</span>
                <span className="px-3 py-1 rounded-lg bg-zinc-950 border border-zinc-800">spaCy NLP</span>
                <span className="px-3 py-1 rounded-lg bg-zinc-950 border border-zinc-800">ReportLab Engine</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
