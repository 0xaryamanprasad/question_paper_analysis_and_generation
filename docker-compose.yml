version: "3.9"

services:
  db:
    image: postgres:16
    container_name: qpaper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qpaper_user
      POSTGRES_PASSWORD: qpaper_pass
      POSTGRES_DB: qpaper_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qpaper_user -d qpaper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qpaper_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://qpaper_user:qpaper_pass@db:5432/qpaper_db
      DATABASE_URL_SYNC: postgresql+psycopg2://qpaper_user:qpaper_pass@db:5432/qpaper_db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qpaper_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
